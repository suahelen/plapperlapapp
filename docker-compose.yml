services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: `docker compose run --rm migrate`. Never runs automatically.
  migrate:
    build: ./backend
    command: ["migrate", "up"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
      ASR_URL: http://asr:8765
    depends_on:
      postgres:
        condition: service_healthy

  # Speech-to-text for spoken answers (CPU). Not exposed; only the API talks to it.
  asr:
    build: ./asr
    restart: unless-stopped
    environment:
      ASR_THREADS: ${ASR_THREADS:-4}
      ASR_IDLE_UNLOAD_MINUTES: ${ASR_IDLE_UNLOAD_MINUTES:-15}
    volumes:
      - asr_models:/models

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  # Public ingress via Cloudflare Tunnel: no inbound ports opened on the router.
  # Hostname -> service routing (plapperlapapp.ch -> web:80) is configured on the
  # Cloudflare dashboard side (Zero Trust > Networks > Tunnels), not here.
  cloudflared:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - web
    profiles: ["public"]

volumes:
  pgdata:
  caddy_data:
  asr_models:
